name: probe gc throttle bound
on:
  workflow_dispatch:
  push:
    branches: [probe/gc-throttle-bound]
permissions:
  contents: read
jobs:
  probe:
    name: probe copy ${{ matrix.copy }}
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2]
    env:
      T: ops::gc::tests::sustained_throttling_aborts_after_the_backoff_cap
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: earth-mover/icechunk
          ref: 875820fd9a862f99409c96e15225e734d5ca7408
          persist-credentials: false
      - name: Toolchain and runner
        run: |
          rustc -V; cargo -V; sysctl -n hw.ncpu machdep.cpu.brand_string
      - name: Instrument the test (print elapsed only)
        run: |
          perl -0pi -e 's/(let elapsed = started\.elapsed\(\);)/$1\n        eprintln!("ELAPSED_MS {}", elapsed.as_secs_f64() * 1000.0);/' icechunk/src/ops/gc.rs
          grep -n -A1 'let elapsed = started.elapsed' icechunk/src/ops/gc.rs
          grep -n 'from_millis(200)' icechunk/src/ops/gc.rs
      - name: Write loop script
        run: |
          cat > "$RUNNER_TEMP/loop.sh" <<'SH'
          #!/bin/bash
          # usage: loop.sh <label> <n> <quiet|loaded>
          label=$1; n=$2; load=$3
          bin=$(cat "$RUNNER_TEMP/bin.txt")
          if [ "$load" = loaded ]; then
            for i in $(seq "$(sysctl -n hw.ncpu)"); do (while :; do :; done) & done
          fi
          fail=0; : > "res_$label.txt"
          for i in $(seq "$n"); do
            if out=$("$bin" "$T" --exact --nocapture 2>&1); then r=pass; else r=FAIL; fail=$((fail+1)); fi
            ms=$(printf '%s\n' "$out" | sed -n 's/^ELAPSED_MS //p')
            echo "$r ${ms:-NA}" >> "res_$label.txt"
          done
          [ "$load" = loaded ] && kill $(jobs -p) 2>/dev/null
          sort -g -k2 "res_$label.txt" | awk -v L="$label" -v F="$fail" -v N="$n" '
            {v[NR]=$2; if ($2+0 >= 200) over++}
            END {printf "%s: %d/%d failed; elapsed ms min %.1f p50 %.1f p90 %.1f p99 %.1f max %.1f; >=200ms: %d\n",
              L, F, N, v[1], v[int(NR*0.5)], v[int(NR*0.9)], v[int(NR*0.99)], v[NR], over+0}' | tee -a "$GITHUB_STEP_SUMMARY"
          grep FAIL "res_$label.txt" | head -5
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/loop.sh"
      - name: Build lib test binary (profile ci, as `just profile=ci unit-test`)
        run: |
          cargo test --profile ci -p icechunk --lib --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .target.name=="icechunk") | .executable' \
            | tail -1 > "$RUNNER_TEMP/bin.txt"
          cat "$RUNNER_TEMP/bin.txt"
          "$(cat "$RUNNER_TEMP/bin.txt")" "$T" --exact --nocapture
      - name: Stock bound, quiet runner (300x)
        run: $RUNNER_TEMP/loop.sh stock-quiet 300 quiet
      - name: Stock bound, one busy loop per CPU (300x)
        run: $RUNNER_TEMP/loop.sh stock-loaded 300 loaded
      - name: Bound 1 s, rebuild
        run: |
          perl -0pi -e 's/Duration::from_millis\(200\)/Duration::from_secs(1)/' icechunk/src/ops/gc.rs
          grep -n 'elapsed < ' icechunk/src/ops/gc.rs
          cargo test --profile ci -p icechunk --lib --no-run --message-format=json 2>/dev/null \
            | jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .target.name=="icechunk") | .executable' \
            | tail -1 > "$RUNNER_TEMP/bin.txt"
      - name: Bound 1 s, one busy loop per CPU (300x)
        run: $RUNNER_TEMP/loop.sh fixed-loaded 300 loaded
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ matrix.copy }}
          path: res_*.txt
